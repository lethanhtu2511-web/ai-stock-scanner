name: Strategy V2 research backtest
on:
  push:
    branches: ["main", "research/**"]
    paths:
      - "strategy_v2.py"
      - "strategy_v2_backtest.py"
      - "top5_walkforward_backtest.py"
      - "adaptive_selection_backtest.py"
      - "independent_oos_swing_backtest.py"
      - "portfolio_execution.py"
      - "portfolio_execution_audit.py"
      - ".github/workflows/strategy-v2-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategy-v2-research
  cancel-in-progress: true
jobs:
  research-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q strategy_v2.py strategy_v2_backtest.py top5_walkforward_backtest.py adaptive_selection_backtest.py independent_oos_swing_backtest.py portfolio_execution.py portfolio_execution_audit.py
      - run: python -m unittest discover -s tests -v
      - run: python strategy_v2_backtest.py
      - run: python top5_walkforward_backtest.py
      - run: python adaptive_selection_backtest.py
      - run: python independent_oos_swing_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-oos-swing-audit-report
          path: |
            strategy_v2_output/
            top3_walkforward_output/
            adaptive_selection_output/
            independent_oos_swing_output/
          if-no-files-found: warn
          retention-days: 30
