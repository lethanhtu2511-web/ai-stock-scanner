name: Scanner code checks

on:
  push:
    branches:
      - chatgpt/ai-stock-scanner-work
  pull_request:
    branches:
      - main
      - upgrade/comprehensive-v1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Import worker modules
        run: python -c "import worker, portfolio, scan_store, scanner"
      - name: Streamlit startup smoke test
        run: |
          streamlit run app.py --server.address=127.0.0.1 --server.port=8501 --server.headless=true > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Build Docker image
        run: docker build --tag ai-stock-scanner-ci .
