name: Historical backtest validation

on:
  push:
    branches: ["main"]
    paths:
      - "historical_backtest.py"
      - "validation_report.py"
      - "run_historical_validation.py"
      - "strategy_engine.py"
      - "adaptive_strategy.py"
      - "scanner.py"
      - "foreign_flow_provider.py"
      - "early_signal_engine.py"
      - "data_provider.py"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCANNER_VALIDATION_MAX_SYMBOLS: "120"
      SCANNER_VALIDATION_CAPITAL: "10000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run historical validation
        run: python run_historical_validation.py
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-stock-scanner-historical-backtest
          path: backtest_output/
          if-no-files-found: warn
          retention-days: 30
